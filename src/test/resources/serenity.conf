serenity {
    take.screenshots = BEFORE_AND_AFTER_EACH_STEP
}
serenity {
    report {
       accessibility = true
    }
}

serenity {
  requirement {
    types = "epic, feature"
  }
}
pages{
  url ="https://10.85.63.171:8443/rwd-web/logon"
}
headless.mode = true

webdriver {
  driver = chrome
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["incognito","remote-allow-origins=*","test-type", "no-sandbox", "ignore-certificate-errors", "--window-size=1000,800",
        "incognito", "disable-infobars", "disable-gpu", "disable-default-apps", "disable-popup-blocking",
        "disable-dev-shm-usage", "disable-extensions", "disable-web-security", "disable-translate", "disable-logging"]
    }
  }
}
